stationary:
  description: "Steady-state acoustic profile with near-zero frame-to-frame spectral flux and uniform energy envelope."
  target_id: 0
  classes:
    - name: "vacuum_cleaner"
      justification: "Uniform motor whine and suction broadband noise."
    - name: "engine"
      justification: "Steady-state combustion and mechanical rotation rumble."
    - name: "wind"
      justification: "Continuous aerodynamic broadband turbulence."
    - name: "rain"
      justification: "Dense, homogeneous high-frequency stochastic noise."
    - name: "sea_waves"
      justification: "Continuous low-frequency broadband surf and water agitation."
    - name: "airplane"
      justification: "Constant high-altitude jet turbine rumble."
    - name: "washing_machine"
      justification: "Continuous motor hum and drum spin."
    - name: "insects"
      justification: "Constant high-frequency cicada/insect drone."
    - name: "crickets"
      justification: "High-density continuous nocturnal cricket bed."
    - name: "helicopter"
      justification: "Quasi-stationary periodic rotor airflow (handled well by spectral subtraction)."
    - name: "pouring_water"
      justification: "Continuous turbulent liquid flow — broadband stationary noise."

non_stationary:
  description: "Time-varying spectral dynamics, dynamic formants, speech babble, or structured modulation."
  target_id: 1
  classes:
    - name: "crying_baby"
      justification: "Highly dynamic harmonic structure and emotional vocal modulation."
    - name: "chirping_birds"
      justification: "Rapid frequency sweeps and non-uniform acoustic calls."
    - name: "footsteps"
      justification: "Sequence of walking events with moving acoustic distance."
    - name: "train"
      justification: "Doppler shifts, track transitions, and variable wheel squeal."
    - name: "church_bells"
      justification: "Complex decaying inharmonic overtones and resonant modes."
    - name: "siren"
      justification: "Continuous frequency modulation (sinusoidal / saw pitch sweeps)."
    - name: "car_horn"
      justification: "Dual-tone burst with variable duration."
    - name: "laughing"
      justification: "Vocal tract bursts and irregular periodic oscillations."
    - name: "crow"
      justification: "Harsh, intermittent animal vocalization."
    - name: "rooster"
      justification: "High-amplitude vocalization with fluctuating harmonic peaks."
    - name: "dog"
      justification: "Intermittent barking with variable pitch and duration."
    - name: "thunderstorm"
      justification: "Rumble mixed with variable atmospheric dynamics."
    - name: "coughing"
      justification: "Short vocal bursts with structured formant dynamics."
    - name: "cow"
      justification: "Prolonged variable vocalization with pitch modulation."
    - name: "frog"
      justification: "Rhythmic croaking with dynamic pitch variation."
    - name: "hen"
      justification: "Rapid clucking sequences with dynamic pitch envelope."
    - name: "pig"
      justification: "Variable squealing and grunting with formant shifts."
    - name: "sheep"
      justification: "Bleating with dynamic formant structure."

impulsive:
  description: "Sudden energy onsets (<20ms attack), high crest factor, rapid exponential decay, localized transients."
  target_id: 2
  classes:
    - name: "door_wood_knock"
      justification: "Classic percussive impact with rapid acoustic ringdown."
    - name: "glass_breaking"
      justification: "High-energy transient shatter and scattering fragments."
    - name: "fireworks"
      justification: "Explosive acoustic shockwaves followed by immediate decay."
    - name: "can_opening"
      justification: "Sharp aluminum pop/snap transient."
    - name: "clapping"
      justification: "Isolated hand impact transients."
    - name: "clock_tick"
      justification: "Discrete, isolated mechanical escapement clicks."
    - name: "mouse_click"
      justification: "Microswitch transient click."
    - name: "keyboard_typing"
      justification: "Key bottom-out percussive clicks."
    - name: "water_drops"
      justification: "Discrete drip impacts with rapid damping."
    - name: "sneezing"
      justification: "Explosive respiratory burst with <100ms attack and rapid decay."

excluded_classes:
  - "crackling_fire"
  - "toilet_flush"
  - "breathing"
  - "brushing_teeth"
  - "snoring"
  - "drinking_sipping"
  - "door_wood_creaks"
  - "chainsaw"
  - "hand_saw"
  - "clock_alarm"
  - "cat"
